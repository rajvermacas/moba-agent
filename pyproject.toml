[tool.poetry]
name = "langgraph-agent-mcp"
version = "0.1.0"
description = "LangGraph agent with MCP integration using Gemini 2.5 Flash"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    {include = "moba_agent", from = "src"},
    {include = "moba_server", from = "src"}
]

[tool.poetry.dependencies]
python = "^3.9"
langchain-mcp-adapters = "^0.1.0"
langgraph = "^0.2.0"
langchain-google-genai = "^2.0.0"
google-generativeai = "^0.8.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
langchain = "^0.3.0"
langchain-core = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"